<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>학교 사람 탐험대 🐰</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@700;800&family=Do+Hyeon&display=swap');

* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Nanum Gothic', 'Jua', sans-serif;
  font-weight: 800;
  background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 45%, #ddd6fe 100%);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── 폰트 (Gaegu 손글씨 제거 · Nanum Gothic ExtraBold + Jua) ── */
.font-jua { font-family: 'Jua', sans-serif; }
.font-gaegu { font-family: 'Nanum Gothic', sans-serif; font-weight: 800; }
.font-nanum { font-family: 'Nanum Gothic', sans-serif; font-weight: 800; }
.font-hi { font-family: 'Nanum Gothic', sans-serif; font-weight: 800; }
.font-do { font-family: 'Do Hyeon', sans-serif; }

/* ── 타입 스케일 (저학년용 큼직하게) ── */
.t-hero { font-size: clamp(2.2rem, 6.5vw, 3.6rem); line-height: 1.12; }
.t-h1   { font-size: clamp(1.8rem, 5vw, 2.7rem); line-height: 1.18; }
.t-h2   { font-size: clamp(1.45rem, 4vw, 2.1rem); line-height: 1.22; }
.t-lg   { font-size: clamp(1.25rem, 3.3vw, 1.7rem); line-height: 1.32; }
.t-md   { font-size: clamp(1.1rem, 2.8vw, 1.4rem); line-height: 1.4; }
.t-base { font-size: clamp(1rem, 2.5vw, 1.25rem); line-height: 1.42; }
.t-sm   { font-size: clamp(0.9rem, 2.2vw, 1.1rem); line-height: 1.4; }

/* ── 레이아웃: 세로 중앙 정렬 (짧으면 중앙, 길면 스크롤·잘림 없음) ── */
.scale-wrap {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  position: relative;
  z-index: 1;
}
.scale-inner { width: 100%; max-width: 980px; }

/* 화면 카드 — 최소 높이로 화면을 꽉 채움 */
.card { background: rgba(255,255,255,0.97); border-radius: 32px; box-shadow: 0 24px 60px -15px rgba(0,0,0,0.22), 0 10px 24px -8px rgba(0,0,0,0.1); }
.screen-card { min-height: 76vh; display: flex; flex-direction: column; justify-content: center; }
.card-hover { transition: all 0.2s ease; cursor: pointer; }
.card-hover:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 28px 65px -15px rgba(0,0,0,0.28); }
.card-hover:active { transform: scale(0.97); }

/* 버튼 */
.btn { font-family: 'Jua', sans-serif; border-radius: 24px; padding: 14px 28px; box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08); transition: all 0.15s ease; user-select: none; border: none; cursor: pointer; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.1); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
.btn:disabled { cursor: default; transform: none; }

/* ── 배경 장식 ── */
.bg-deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.45; }
.bg-emoji { position: absolute; opacity: 0.22; user-select: none; }

/* ── 애니메이션 ── */
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
.hop { animation: hop 2s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.wiggle { animation: wiggle 1.5s ease-in-out infinite; }
@keyframes pulse-glow { 0%, 100% { box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 0 30px rgba(251, 191, 36, 0.5); } 50% { box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 0 55px rgba(251, 191, 36, 0.95); } }
.pulse-glow { animation: pulse-glow 1.8s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.float { animation: float 3s ease-in-out infinite; }
@keyframes floatSlow { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-22px) rotate(8deg); } }
.float-slow { animation: floatSlow 6s ease-in-out infinite; }
@keyframes spinSlow { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.spin-slow { animation: spinSlow 14s linear infinite; }
@keyframes sparkle { 0%, 100% { opacity: 0.3; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.25); } }
.sparkle { animation: sparkle 1.6s ease-in-out infinite; }
@keyframes confetti-fall { 0% { transform: translateY(-110vh) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
.confetti { position: fixed; top: -40px; font-size: 2.2rem; pointer-events: none; animation: confetti-fall 3s linear forwards; z-index: 9999; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.blink { animation: blink 1s ease-in-out infinite; }
@keyframes pop-in { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
.pop-in { animation: pop-in 0.45s ease-out; }
@keyframes bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.bounce-soft { animation: bounce-soft 1.2s ease-in-out infinite; }

/* TTS 하이라이트 */
.tts-active { background: linear-gradient(120deg, #fef08a, #fde68a); padding: 2px 6px; border-radius: 6px; }

/* 스크롤바 숨김 */
::-webkit-scrollbar { width: 0; height: 0; }
* { scrollbar-width: none; }

/* 별점 */
.star { font-size: clamp(2.6rem, 8vw, 3.6rem); cursor: pointer; transition: all 0.15s; user-select: none; }
.star:hover { transform: scale(1.18); }
.star-on { color: #fbbf24; filter: drop-shadow(0 4px 8px rgba(251, 191, 36, 0.55)); }
.star-off { color: #e5e7eb; }

/* 드래그앤드롭 */
.drag-card { cursor: grab; touch-action: none; }
.drag-card:active { cursor: grabbing; }
.drop-zone-active { background: rgba(167, 243, 208, 0.5) !important; border-color: #10b981 !important; transform: scale(1.06); }

/* 스피커 토글 */
.speaker-on { background: linear-gradient(135deg, #34d399, #10b981); color: white; }
.speaker-off { background: #e5e7eb; color: #6b7280; }

/* 수료증 */
.cert-frame { background: linear-gradient(135deg, #fef3c7, #fef9c3); border: 9px double #d97706; }
.cert-stamp { background: radial-gradient(circle, #fee2e2 0%, #fecaca 100%); border: 4px solid #dc2626; color: #991b1b; }
</style>
